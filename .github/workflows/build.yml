name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build -x test
      - name: Tag jar with commit
        run: mv build/libs/openorigins-1.0.1.jar "build/libs/openorigins-1.0.1-${GITHUB_SHA::7}.jar"
      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: openorigins
          path: build/libs/*.jar
