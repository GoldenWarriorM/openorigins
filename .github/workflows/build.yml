name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build
      - name: Tag jar with commit
        run: |
          VERSION=$(grep -m1 '^mod_version=' gradle.properties | cut -d= -f2)
          mv "build/libs/openorigins-${VERSION}.jar" "build/libs/openorigins-${VERSION}-${GITHUB_SHA::7}.jar"
      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: openorigins
          path: build/libs/*.jar
