name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build

      - name: Prepare release notes
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          notes="build/release-notes-${ver}.md"
          # Body = "# Changelog" + this version's section of CHANGELOG.md.
          section=$(awk -v ver="$ver" '
            $0 ~ "^## \\[" {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found = 1 }
            }
            found
          ' CHANGELOG.md)
          if [ -z "$section" ]; then
            echo "::error::CHANGELOG.md has no '## [${ver}]' section"
            exit 1
          fi
          mkdir -p build
          { printf '# Changelog\n\n'; printf '%s\n' "$section"; } > "$notes"
          echo "--- ${notes} ---"
          cat "$notes"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          notes="build/release-notes-${ver}.md"
          jar="build/libs/openorigins-${ver}.jar"
          [ -f "$jar" ] || { echo "::error::missing $jar"; exit 1; }
          # Pre-release for anything with a semver suffix (2.0.0-beta2, 2.1.0-rc1).
          if [ "${ver#*-}" != "$ver" ]; then pre="--prerelease"; else pre=""; fi

          # The release API flakes with 500/HttpError, so every call is retried
          # (5 attempts, 5s doubling backoff) and stays idempotent on reruns.
          retry() {
            local max=5 n=1 delay=5 out
            while true; do
              "$@" && return 0
              out=$?
              if [ "$n" -ge "$max" ]; then
                echo "::error::gave up after ${n} attempts (last exit ${out}): $*"
                return "$out"
              fi
              echo "attempt ${n}/${max} failed (exit ${out}), retrying in ${delay}s: $*" >&2
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          ensure_release() {
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && return 0
            gh release create "$GITHUB_REF_NAME" --title "$ver" \
              --notes-file "$notes" ${pre:+$pre}
          }

          retry ensure_release
          retry gh release upload "$GITHUB_REF_NAME" "$jar" --clobber
          # Re-apply notes and the pre-release flag so reruns and hand-made
          # releases end up identical.
          retry gh release edit "$GITHUB_REF_NAME" --notes-file "$notes" ${pre:+$pre}

      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" \
            --json tagName,isDraft,isPrerelease,assets \
            --jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[] | "\(.name) \(.size)B"]}'
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '[.assets[].name] | index("openorigins-'"$ver"'.jar")' \
            | grep -qv '^null$' || { echo "::error::openorigins-${ver}.jar is not attached"; exit 1; }
