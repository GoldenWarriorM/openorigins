plugins {
  id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.mod_group

base { archivesName = project.mod_id }

java {
  toolchain { languageVersion = JavaLanguageVersion.of(project.java_version.toInteger()) }
}

loom {
  splitEnvironmentSourceSets()
  mods {
    "${project.mod_id}" {
      sourceSet sourceSets.main
      sourceSet sourceSets.client
    }
  }
}

repositories {
  maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  implementation "net.fabricmc:fabric-loader:${project.loader_version}"
  implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
  compileOnly "com.terraformersmc:modmenu:20.0.3"

  testImplementation platform("org.junit:junit-bom:5.11.4")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
  testImplementation "com.google.code.gson:gson:2.11.0"
}

// Unit tests only see the client source set: the whole mod lives there.
sourceSets {
  test {
    compileClasspath += sourceSets.client.output
    runtimeClasspath += sourceSets.client.output
  }
}

tasks.named("test") {
  useJUnitPlatform()
  testLogging {
    events "failed"
    exceptionFormat "full"
  }
}

processResources {
  inputs.property "version", project.version
  filesMatching("fabric.mod.json") { expand "version": project.version }
}

def gitSha = providers.exec {
  commandLine("git", "rev-parse", "--short", "HEAD")
}.standardOutput.asText.map { it.trim() }.getOrElse("nogit")

tasks.named("jar") {
  manifest {
    attributes(
        "Implementation-Title": project.mod_id,
        "Implementation-Version": "${project.version}+${gitSha}",
        "Git-Commit": gitSha
    )
  }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
